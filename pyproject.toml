[project]
name = "torch-sheaf-admm"
version = "0.1.0"
description = "Unofficial PyTorch port of Sheaf-ADMM for students and educational projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Raphaël Le Bidan" }]
dependencies = [
    "torch==2.14.0",
    "numpy>=1.26",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # dataset construction — required to build MNIST / Sudoku / maze locally
    "ml-datasets>=0.2",
    "datasets>=2.18",
    "huggingface-hub>=0.23",
    # figures / artifacts
    "matplotlib>=3.8",
    "pillow>=10.0",
    # experiment tracking
    "wandb>=0.17",
]

[project.urls]
"Original JAX implementation" = "https://github.com/SakanaAI/sheaf-admm"
"Paper" = "https://arxiv.org/abs/2605.31005"

[project.optional-dependencies]
reference = ["jax>=0.4.30", "flax>=0.8", "optax>=0.2"]

# Use the CUDA-enabled PyTorch wheel on Linux; other platforms use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_admm"]

[tool.hatch.build.targets.sdist]
include = [
    "/assets",
    "/configs",
    "/scripts",
    "/src",
    "/tests",
    "/validation",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that train a tiny model (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep math unicode (ρ, σ, γ, η, λ) — they read better than ASCII in this codebase.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741", "RUF002", "RUF003", "B008"]
