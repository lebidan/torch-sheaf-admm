# @package _global_
# Sheaf-ADMM Minesweeper 9x9 / 10 mines, uniquely solvable boards
# (python -m sheaf_admm.data.build_minesweeper).
#
# * Agents: 5x5 patches every 2 cells -> 9 agents, 308 shared-cell edges. Every
#   3x3 neighbourhood of a number fits inside one agent (checked by the task).
# * rm_sharing sudoku + rm_num_slots 25: one restriction map per position inside
#   the patch; soft_slice makes position k read block k of the agent state, so
#   agent_state_dim = 25 cells x message_dim.
# * agent_state_dim (internal name d_v): size of each agent's state vector.
#   message_dim (internal name d_e): size of the message two agents exchange
#   about one shared cell.
# * mine_weight: mines are ~20% of the hidden cells (10 of ~50).
# * Loss and metrics only on hidden cells (revealed cells are safe by definition).
# * *_topk metrics: the m highest-scoring hidden cells are mines (m = mine count).
# * Same recipe as minesweeper_6x6_sheaf.yaml (92% solved_topk on 6x6): batch 512,
#   cg_iters 3, 40 epochs. Longer deductions on 9x9 (3x3 agent grid): K drawn in
#   [5, 12], evaluated at K = 12. Check with scripts.eval_k whether more
#   iterations help; if so, raise K_train together with K_eval.
task: minesweeper
model_type: sheaf

training:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 40
  lr_schedule: cosine
  min_lr_ratio: 0.05
  batch_size: 512
  K_train: 12
  train_iters_dist: uniform
  train_iters_min: 5
  K_eval: 12
  loss_window: 2
  val_interval: 1
  best_metric: solved_topk

data:
  dir: datasets/minesweeper_9x9
  train_split: train
  val_splits: [test]
  loader: puzzle
  augment: dihedral

task_cfg:
  patch_size: 5
  stride: 2
  mine_weight: 2.0
  mask_revealed: true
  topk_decode: true

model:
  num_classes: 2
  agent_state_dim: 200   # d_v: 25 cells per agent x 8 numbers per cell
  message_dim: 8         # d_e: numbers exchanged per shared cell
  encoder_arch: mlp
  enc_hidden_dim: 256
  dropout_rate: 0.1
  comm_norm_type: layernorm
  objective_mode: non_negative
  x_solver: diagonal_prox
  z_solver: unrolled_cg
  z_mode: prox
  gamma: 2.0
  cg_iters: 3
  rm_sharing: sudoku     # per-slot maps (alias: slot)
  rm_num_slots: 25       # one per cell position in a 5x5 patch
  rm_init: soft_slice
  rm_mode: fixed
  rho_init: 0.25
  decoder_arch: mlp_concat_v2
  dec_hidden_dim: 256
  dec_output_shape: [25, 2]
